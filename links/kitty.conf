# Kitty — the Linux workstation terminal (iTerm2 stays on macOS).
# Font: MesloLGS NF (the powerlevel10k-recommended patched Meslo).
font_family      MesloLGS NF
font_size        12.0

shell            /usr/bin/zsh --login
enable_audio_bell no
tab_bar_style    powerline

# ── Solarized Dark ───────────────────────────────────────────────────────────
background            #002b36
foreground            #839496
cursor                #93a1a1
cursor_text_color     #002b36
selection_background  #073642
selection_foreground  #93a1a1
url_color             #2aa198

# black
color0  #073642
color8  #002b36
# red
color1  #dc322f
color9  #cb4b16
# green
color2  #859900
color10 #586e75
# yellow
color3  #b58900
color11 #657b83
# blue
color4  #268bd2
color12 #839496
# magenta
color5  #d33682
color13 #6c71c4
# cyan
color6  #2aa198
color14 #93a1a1
# white
color7  #eee8d5
color15 #fdf6e3
